<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>lamma breezy - Cafe Ordering System</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen">

  <div id="app" class="min-h-screen flex flex-col">
    <!-- Header -->
    <header class="bg-sky-700 text-white sticky top-0 z-30 shadow-md">
      <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
        <div class="flex items-center space-x-3">
          <div class="bg-white/10 p-2 rounded-lg border border-white/20">
            <i data-lucide="waves" class="w-6 h-6"></i>
          </div>
          <div>
            <h1 class="text-xl font-bold tracking-tight">lamma breezy</h1>
            <p class="text-xs text-sky-200 tracking-wider">OCEAN CAFE & ROASTERY</p>
          </div>
        </div>

        <div class="flex bg-sky-800/80 p-1 rounded-xl border border-sky-600/50 text-sm">
          <button id="btn-customer" onclick="switchView('customer')" class="flex items-center space-x-1.5 px-3 py-1.5 rounded-lg font-medium bg-white text-sky-800 shadow-sm transition">
            <i data-lucide="coffee" class="w-4 h-4"></i>
            <span>顧客點餐</span>
          </button>
          <button id="btn-kitchen" onclick="switchView('kitchen')" class="flex items-center space-x-1.5 px-3 py-1.5 rounded-lg font-medium text-sky-100 hover:text-white transition">
            <i data-lucide="utensils" class="w-4 h-4"></i>
            <span>廚房接單</span>
          </button>
        </div>
      </div>
    </header>

    <!-- Main View Area -->
    <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full grid grid-cols-1 lg:grid-cols-12 gap-8">
      
      <!-- Customer View Left: Menu -->
      <div id="view-customer-menu" class="lg:col-span-8 flex flex-col space-y-6">
        <!-- Categories -->
        <div class="flex justify-between items-center bg-white p-4 rounded-2xl shadow-sm border border-slate-100 overflow-x-auto">
          <div class="flex space-x-2">
            <button onclick="filterCategory('all')" class="cat-btn px-4 py-2 rounded-xl text-sm font-medium bg-sky-600 text-white shadow-sm" data-cat="all">全部</button>
            <button onclick="filterCategory('coffee')" class="cat-btn px-4 py-2 rounded-xl text-sm font-medium bg-slate-100 text-slate-600" data-cat="coffee">精品咖啡</button>
            <button onclick="filterCategory('drinks')" class="cat-btn px-4 py-2 rounded-xl text-sm font-medium bg-slate-100 text-slate-600" data-cat="drinks">特飲</button>
            <button onclick="filterCategory('food')" class="cat-btn px-4 py-2 rounded-xl text-sm font-medium bg-slate-100 text-slate-600" data-cat="food">輕食</button>
            <button onclick="filterCategory('dessert')" class="cat-btn px-4 py-2 rounded-xl text-sm font-medium bg-slate-100 text-slate-600" data-cat="dessert">甜品</button>
          </div>
        </div>

        <!-- Menu Grid -->
        <div id="menu-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
      </div>

      <!-- Customer View Right: Cart -->
      <div id="view-customer-cart" class="lg:col-span-4">
        <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 sticky top-24 flex flex-col h-[calc(100vh-8rem)]">
          <div class="flex justify-between items-center pb-4 border-b border-slate-100">
            <h2 class="text-lg font-bold text-slate-800 flex items-center space-x-2">
              <i data-lucide="shopping-bag" class="w-5 h-5"></i>
              <span>已選餐點</span>
            </h2>
            <div class="flex bg-slate-100 p-1 rounded-lg text-xs font-medium">
              <button id="btn-type-dinein" onclick="setOrderType('dine-in')" class="px-3 py-1 rounded-md bg-sky-600 text-white transition">堂食</button>
              <button id="btn-type-takeaway" onclick="setOrderType('takeaway')" class="px-3 py-1 rounded-md text-slate-600 transition">外賣</button>
            </div>
          </div>

          <div id="table-no-box" class="py-2 px-3 bg-sky-50/60 rounded-xl my-3 flex justify-between items-center text-xs text-sky-800">
            <span>桌號 Table No.</span>
            <input type="text" id="table-input" value="A03" class="w-16 text-center font-bold bg-white border border-sky-200 rounded-md py-1 text-sky-900 focus:outline-none" />
          </div>

          <div id="cart-items" class="flex-1 overflow-y-auto py-3 space-y-3"></div>

          <div class="pt-4 border-t border-slate-100 space-y-2">
            <div class="flex justify-between text-xs text-slate-500">
              <span>小計 Subtotal</span>
              <span id="txt-subtotal">$0</span>
            </div>
            <div id="row-service" class="flex justify-between text-xs text-slate-500">
              <span>服務費 (10%)</span>
              <span id="txt-service">$0</span>
            </div>
            <div class="flex justify-between font-bold text-base text-slate-800 pt-1">
              <span>總額 Total</span>
              <span id="txt-total" class="text-sky-700">$0</span>
            </div>
            <button id="btn-checkout" onclick="openCheckout()" disabled class="w-full bg-sky-600 hover:bg-sky-700 disabled:bg-slate-300 text-white font-semibold py-3 rounded-xl shadow-md transition text-sm mt-3">
              前往付款
            </button>
          </div>
        </div>
      </div>

      <!-- Kitchen Display System (Hidden by default) -->
      <div id="view-kitchen" class="lg:col-span-12 hidden">
        <h2 class="text-2xl font-bold text-slate-800 mb-6">廚房 / 接單實時顯示系統 (KDS)</h2>
        <div id="kitchen-orders-grid" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
      </div>

    </main>
  </div>

  <!-- JavaScript App Logic -->
  <script>
    const MENU = [
      { id: '1', name: 'Lamma Breeze Cold Brew', category: 'coffee', price: 48, desc: '特調椰香冷萃咖啡，帶有淡淡海鹽奶蓋香氣', img: 'https://images.unsplash.com/photo-1517701604599-bb29b565090c?w=400&q=80' },
      { id: '2', name: 'Ocean Flat White', category: 'coffee', price: 42, desc: '雙倍濃縮搭配濃郁燕麥奶與細緻奶泡', img: 'https://images.unsplash.com/photo-1577968897966-3d4325b36b61?w=400&q=80' },
      { id: '3', name: 'Uji Matcha Oat Latte', category: 'drinks', price: 48, desc: '日本宇治抹茶配以燕麥奶，香濃順滑', img: 'https://images.unsplash.com/photo-1536256263959-770b48d82b0a?w=400&q=80' },
      { id: '4', name: 'Avocado Sourdough Toast', category: 'food', price: 78, desc: '牛油果酸酵母吐司配水波蛋及海鹽碎', img: 'https://images.unsplash.com/photo-1525351484163-7529414344d8?w=400&q=80' },
      { id: '5', name: 'Basque Sea Salt Cheesecake', category: 'dessert', price: 52, desc: '手工焦香巴斯克芝士蛋糕配沖繩海鹽', img: 'https://images.unsplash.com/photo-1533134242443-d4fd215305ad?w=400&q=80' }
    ];

    let cart = [];
    let orderType = 'dine-in';
    let currentCategory = 'all';
    let orders = [];

    function renderMenu() {
      const container = document.getElementById('menu-grid');
      container.innerHTML = '';
      
      const filtered = currentCategory === 'all' ? MENU : MENU.filter(m => m.category === currentCategory);

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = "bg-white rounded-2xl p-4 shadow-sm border border-slate-100 flex space-x-4";
        card.innerHTML = `
          <img src="${item.img}" class="w-20 h-20 rounded-xl object-cover" />
          <div class="flex-1 flex flex-col justify-between">
            <div>
              <h3 class="font-semibold text-slate-800 text-sm">${item.name}</h3>
              <p class="text-xs text-slate-500 line-clamp-2 mt-1">${item.desc}</p>
            </div>
            <div class="flex justify-between items-center mt-2">
              <span class="text-sky-700 font-bold text-sm">$${item.price}</span>
              <button onclick="addToCart('${item.id}')" class="bg-sky-600 hover:bg-sky-700 text-white px-3 py-1.5 rounded-lg text-xs font-medium transition">
                + 加入
              </button>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function addToCart(id) {
      const item = MENU.find(m => m.id === id);
      const existing = cart.find(c => c.id === id);
      if (existing) {
        existing.qty += 1;
      } else {
        cart.push({ ...item, qty: 1 });
      }
      renderCart();
    }

    function updateQty(id, delta) {
      cart = cart.map(item => {
        if (item.id === id) {
          const qty = item.qty + delta;
          return qty > 0 ? { ...item, qty } : null;
        }
        return item;
      }).filter(Boolean);
      renderCart();
    }

    function renderCart() {
      const container = document.getElementById('cart-items');
      container.innerHTML = '';

      if (cart.length === 0) {
        container.innerHTML = `<div class="text-center py-12 text-slate-400 text-xs">購物車目前為空</div>`;
      } else {
        cart.forEach(item => {
          const div = document.createElement('div');
          div.className = "flex justify-between items-center bg-slate-50 p-3 rounded-xl text-xs";
          div.innerHTML = `
            <div>
              <div class="font-medium text-slate-800">${item.name}</div>
              <div class="text-sky-700 font-bold mt-0.5">$${item.price}</div>
            </div>
            <div class="flex items-center space-x-2 bg-white px-2 py-1 rounded-lg border border-slate-200">
              <button onclick="updateQty('${item.id}', -1)" class="text-slate-500 font-bold">-</button>
              <span class="font-semibold w-4 text-center">${item.qty}</span>
              <button onclick="updateQty('${item.id}', 1)" class="text-slate-500 font-bold">+</button>
            </div>
          `;
          container.appendChild(div);
        });
      }

      const subtotal = cart.reduce((sum, item) => sum + item.price * item.qty, 0);
      const service = orderType === 'dine-in' ? Math.round(subtotal * 0.1) : 0;
      const total = subtotal + service;

      document.getElementById('txt-subtotal').innerText = `$${subtotal}`;
      document.getElementById('txt-service').innerText = `$${service}`;
      document.getElementById('txt-total').innerText = `$${total}`;
      document.getElementById('btn-checkout').disabled = cart.length === 0;
    }

    function setOrderType(type) {
      orderType = type;
      document.getElementById('btn-type-dinein').className = type === 'dine-in' ? 'px-3 py-1 rounded-md bg-sky-600 text-white transition' : 'px-3 py-1 rounded-md text-slate-600 transition';
      document.getElementById('btn-type-takeaway').className = type === 'takeaway' ? 'px-3 py-1 rounded-md bg-sky-600 text-white transition' : 'px-3 py-1 rounded-md text-slate-600 transition';
      document.getElementById('table-no-box').style.display = type === 'dine-in' ? 'flex' : 'none';
      document.getElementById('row-service').style.display = type === 'dine-in' ? 'flex' : 'none';
      renderCart();
    }

    function filterCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(btn => {
        if (btn.getAttribute('data-cat') === cat) {
          btn.className = 'cat-btn px-4 py-2 rounded-xl text-sm font-medium bg-sky-600 text-white shadow-sm';
        } else {
          btn.className = 'cat-btn px-4 py-2 rounded-xl text-sm font-medium bg-slate-100 text-slate-600';
        }
      });
      renderMenu();
    }

    function openCheckout() {
      const orderId = `LB-${Math.floor(1000 + Math.random() * 9000)}`;
      alert(`付款成功！單號：${orderId}`);
      cart = [];
      renderCart();
    }

    function switchView(view) {
      if (view === 'customer') {
        document.getElementById('view-customer-menu').classList.remove('hidden');
        document.getElementById('view-customer-cart').classList.remove('hidden');
        document.getElementById('view-kitchen').classList.add('hidden');
        document.getElementById('btn-customer').className = 'flex items-center space-x-1.5 px-3 py-1.5 rounded-lg font-medium bg-white text-sky-800 shadow-sm transition';
        document.getElementById('btn-kitchen').className = 'flex items-center space-x-1.5 px-3 py-1.5 rounded-lg font-medium text-sky-100 hover:text-white transition';
      } else {
        document.getElementById('view-customer-menu').classList.add('hidden');
        document.getElementById('view-customer-cart').classList.add('hidden');
        document.getElementById('view-kitchen').classList.remove('hidden');
        document.getElementById('btn-kitchen').className = 'flex items-center space-x-1.5 px-3 py-1.5 rounded-lg font-medium bg-white text-sky-800 shadow-sm transition';
        document.getElementById('btn-customer').className = 'flex items-center space-x-1.5 px-3 py-1.5 rounded-lg font-medium text-sky-100 hover:text-white transition';
      }
    }

    // Init
    window.onload = function() {
      lucide.createIcons();
      renderMenu();
      renderCart();
    };
  </script>
</body>
</html>
